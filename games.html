<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Game Arcade</title>
        <link rel="stylesheet" href="styles.css">
    </head>
    <body>
        <header>
            <h1>Game Arcade</h1>
            <p class="tagline">Pick a challenge and jump in.</p>
        </header>

        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="aboutme.html">About Us</a></li>
                <li><a href="contact.html">Contact</a></li>
                <li><a href="games.html" class="active">Games</a></li>
            </ul>
        </nav>

        <main>
            <section class="card">
                <h2>Choose Your Game</h2>

                <div class="game-gallery">
                    <a href="numgame/numgame.html" class="game-card-link">
                        <div class="game-thumb thumb-number" aria-hidden="true">
                            <div class="mini-scene scene-number">
                                <div class="mini-header"></div>
                                <div class="mini-prompt"></div>
                                <div class="mini-grid">
                                    <span></span><span></span><span></span><span></span><span></span>
                                </div>
                                <div class="mini-bubble">7</div>
                            </div>
                        </div>
                        <div class="game-card-copy">
                            <strong>Number Game</strong>
                            <span>Guess the secret number</span>
                        </div>
                    </a>

                    <a href="wordgame/wordgame.html" class="game-card-link">
                        <div class="game-thumb thumb-word" aria-hidden="true">
                            <div class="mini-scene scene-word">
                                <div class="mini-header"></div>
                                <div class="mini-wordbox">
                                    <span></span>
                                    <span></span>
                                    <span></span>
                                    <span></span>
                                    <span></span>
                                </div>
                                <div class="mini-keys">
                                    <span>Q</span><span>W</span><span>E</span><span>R</span><span>T</span><span>Y</span>
                                </div>
                            </div>
                        </div>
                        <div class="game-card-copy">
                            <strong>Wordle</strong>
                            <span>Crack the hidden word</span>
                        </div>
                    </a>

                    <a href="snake-game/snakegame.html" class="game-card-link">
                        <div class="game-thumb thumb-snake" aria-hidden="true">
                            <div class="mini-scene scene-snake">
                                <div class="mini-header"></div>
                                <div class="mini-board"></div>
                                <div class="mini-snake"></div>
                                <div class="mini-food"></div>
                            </div>
                        </div>
                        <div class="game-card-copy">
                            <strong>Snake Game</strong>
                            <span>Grow long and stay alive</span>
                        </div>
                    </a>

                    <a href="ponggame/ponggame.html" class="game-card-link">
                        <div class="game-thumb thumb-pong" aria-hidden="true">
                            <div class="mini-scene scene-pong">
                                <div class="mini-header"></div>
                                <div class="mini-court">
                                    <div class="mini-paddle left"></div>
                                    <div class="mini-paddle right"></div>
                                    <div class="mini-ball"></div>
                                </div>
                            </div>
                        </div>
                        <div class="game-card-copy">
                            <strong>Pong Game</strong>
                            <span>Rally, score, and win</span>
                        </div>
                    </a>
                </div>
            </section>
        </main>

        <footer>
            <p>&copy; Learning Test Project. All rights reserved.</p>
        </footer>
    </body>
</html>
