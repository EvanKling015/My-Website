<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Game Arcade</title>
        <link rel="stylesheet" href="styles.css">
    </head>
    <body>
        <header>
            <h1>Game Arcade</h1>
            <p class="tagline">Pick a challenge and jump in.</p>
        </header>

        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="aboutme.html">About Us</a></li>
                <li><a href="contact.html">Contact</a></li>
                <li><a href="games.html" class="active">Games</a></li>
            </ul>
        </nav>

        <main>
            <section class="card">
                <h2>Choose Your Game</h2>

                <div class="game-gallery">
                    <a href="numgame/numgame.html" class="game-card-link">
                        <div class="game-thumb thumb-number" aria-hidden="true">
                            <span class="thumb-art">🎯</span>
                        </div>
                        <div class="game-card-copy">
                            <strong>Number Game</strong>
                            <span>Guess the secret number</span>
                        </div>
                    </a>

                    <a href="wordgame/wordgame.html" class="game-card-link">
                        <div class="game-thumb thumb-word" aria-hidden="true">
                            <span class="thumb-art">🧠</span>
                        </div>
                        <div class="game-card-copy">
                            <strong>Word Game</strong>
                            <span>Crack the hidden word</span>
                        </div>
                    </a>

                    <a href="snake-game/snakegame.html" class="game-card-link">
                        <div class="game-thumb thumb-snake" aria-hidden="true">
                            <span class="thumb-art">🐍</span>
                        </div>
                        <div class="game-card-copy">
                            <strong>Snake Game</strong>
                            <span>Grow long and stay alive</span>
                        </div>
                    </a>

                    <a href="ponggame/ponggame.html" class="game-card-link">
                        <div class="game-thumb thumb-pong" aria-hidden="true">
                            <span class="thumb-art">🏓</span>
                        </div>
                        <div class="game-card-copy">
                            <strong>Pong Game</strong>
                            <span>Rally, score, and win</span>
                        </div>
                    </a>
                </div>
            </section>
        </main>

        <footer>
            <p>&copy; Learning Test Project. All rights reserved.</p>
        </footer>
    </body>
</html>
