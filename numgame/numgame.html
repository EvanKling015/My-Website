        <main>
            <section class="card game-card">
                <h2>Play the Number Game</h2>
                <p class="tagline">Guess the secret number between 1 and 100.</p>
            </section>

            <div class="game-box">
                <label for="num-field">Make a guess:</label>
                <input type="number" id="num-field">
                <button id="guess-button">Make Guess</button>
                <button id="reset-button">Reset Game</button>

                <p id="message-text">Enter a number between 1 and 100</p>
                <p id="guess-count-text">Guesses: 0</p>
            </div>
