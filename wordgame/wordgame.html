<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Word Game</title>
        <link rel="stylesheet" href="../styles.css">
        <link rel="stylesheet" href="wordgame.css">
        <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.4.0/dist/confetti.browser.min.js"></script>
    </head>
    <body>
        <header>
            <h1>Welcome to Our Word Game</h1>
        </header>
        <nav>
            <ul>
                <li><a href="../index.html">Home</a></li>
                <li><a href="../aboutme.html">About Us</a></li>
                <li><a href="../contact.html">Contact</a></li>
                <li><a href="../games.html">Games</a></li>
            </ul>
        </nav>

        <main>
            <a href="../games.html" class="back-link">← Back to Games</a>
            <section class="card game-card">
                <div class="wordle-shell">
                    <div id="guess-display" class="guess-display" aria-live="polite"></div>

                    <div id="keyboard" class="keyboard" aria-label="Word keyboard"></div>

                    <p id="message-text">Guess the hidden word.</p>

                    <div id="round-summary" class="round-summary" hidden aria-live="polite"></div>

                    <div class="summary-actions">
                        <button id="play-again" type="button" hidden>Play Again</button>
                        <button id="reset-history" class="secondary-button" type="button">Reset History</button>
                    </div>
                </div>

                <input type="text" id="guess-field" maxlength="5" autocomplete="off" aria-label="Guess input" />
            </section>
        </main>

        <footer>
            <p>&copy; Learning Test Project. All rights reserved.</p>
        </footer>

        <script src="wordgame.js"></script>
        <!-- <script src="wordgame_test.js"></script> !-->
    </body>
</html>
